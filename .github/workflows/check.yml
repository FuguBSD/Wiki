name: Check

# The two gates of the library: the prose standard and the secret
# scan. The library holds prose pages only, and it has no
# specification of its own, so it consumes no tooling pack. This
# workflow runs the canonical scripts from FuguBSD/Tooling instead, so
# no synced copy can drift here.
#
# A failure reports only. No ruleset makes these checks required, so a
# capture always reaches the branch. Capture stays cheap, and the gate
# stays advisory.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the library
        uses: actions/checkout@v4
        with:
          path: wiki
          # The gitleaks gate scans the full history.
          fetch-depth: 0

      - name: Checkout FuguBSD/Tooling
        uses: actions/checkout@v4
        with:
          repository: FuguBSD/Tooling
          path: tooling

      # --root keeps the walk inside the library, so the tooling
      # checkout beside it never reaches the prose gate.
      - name: Prose standard
        run: perl tooling/org/sync/scripts/ste-lint --root wiki

      # The setup-gitleaks action is gone. deps/Linux.txt names the
      # release, deps/SHA256.txt records its digest, and the
      # canonical scripts/deps compares the downloaded bytes against
      # that digest. The script reads the manifest relative to the
      # current directory, so the step runs inside the library.
      - name: Install gitleaks
        working-directory: wiki
        run: |
          perl ../tooling/org/sync/scripts/deps tool
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Secret scan
        run: gitleaks detect --source wiki --no-banner --redact
